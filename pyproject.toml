[build-system]
requires = ["scikit-build-core", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "ecc-tools-bin"
version = "0.1.0-alpha.12"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.4",
    "numpy",
]

[tool.scikit-build]
cmake.define.BUILD_ECOS = 1
build.verbose = true
build.targets = ["ecc_py"]
# Rebuilding and reinstalling the extension while Python is importing it can
# replace the native payload before dlopen completes. Native builds remain an
# explicit build step; editable imports use the last completed install.
editable.rebuild = false
build-dir = "build"

[dependency-groups]
dev = [
    "auditwheel",
    "scikit-build-core",
]

name: CI

# Every pull request runs the full CI unconditionally: "Build Wheel" and
# "Test Python API" are required status checks on main, and a paths filter
# would leave those checks pending forever on PRs that match no path,
# blocking merge.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-native-geometry:
    name: Test Native Geometry (ASan/UBSan)
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test prerequisites
        run: |
          dnf install -y gcc-c++ make \
            gcc-toolset-14-libasan-devel gcc-toolset-14-libubsan-devel \
            || { echo '--- available sanitizer packages ---'; dnf list available 'gcc-toolset-*san*'; exit 1; }

      - name: Build geometry unit tests
        run: |
          g++ -std=c++20 -o /tmp/geometry_data_tests \
            src/database/data/geometry/GeometrySpatialIndex.cpp \
            src/database/data/geometry/GeometryStore.cpp \
            src/database/data/geometry/GeometryTilePyramid.cpp \
            src/database/data/geometry/ShapeTable.cpp \
            src/database/data/geometry/test/GeometryDataTests.cpp \
            -Isrc/database/data/geometry
          g++ -std=c++20 -o /tmp/idb_geometry_tests \
            src/database/basic/geometry/IdbGeometry.cpp \
            src/database/basic/geometry/IdbLayerShape.cpp \
            src/database/basic/geometry/IdbTree.cpp \
            src/database/basic/geometry/test/IdbGeometryTests.cpp \
            -Isrc/database/basic/geometry

      - name: Run geometry unit tests (plain)
        run: /tmp/geometry_data_tests && /tmp/idb_geometry_tests

      - name: Run geometry unit tests (AddressSanitizer)
        run: |
          g++ -std=c++20 -fsanitize=address -fno-sanitize-recover=all -o /tmp/geometry_data_tests_asan \
            src/database/data/geometry/GeometrySpatialIndex.cpp \
            src/database/data/geometry/GeometryStore.cpp \
            src/database/data/geometry/GeometryTilePyramid.cpp \
            src/database/data/geometry/ShapeTable.cpp \
            src/database/data/geometry/test/GeometryDataTests.cpp \
            -Isrc/database/data/geometry
          g++ -std=c++20 -fsanitize=address -fno-sanitize-recover=all -o /tmp/idb_geometry_tests_asan \
            src/database/basic/geometry/IdbGeometry.cpp \
            src/database/basic/geometry/IdbLayerShape.cpp \
            src/database/basic/geometry/IdbTree.cpp \
            src/database/basic/geometry/test/IdbGeometryTests.cpp \
            -Isrc/database/basic/geometry
          /tmp/geometry_data_tests_asan && /tmp/idb_geometry_tests_asan

      - name: Run geometry unit tests (UndefinedBehaviorSanitizer)
        run: |
          g++ -std=c++20 -fsanitize=undefined -fno-sanitize-recover=all -o /tmp/geometry_data_tests_ubsan \
            src/database/data/geometry/GeometrySpatialIndex.cpp \
            src/database/data/geometry/GeometryStore.cpp \
            src/database/data/geometry/GeometryTilePyramid.cpp \
            src/database/data/geometry/ShapeTable.cpp \
            src/database/data/geometry/test/GeometryDataTests.cpp \
            -Isrc/database/data/geometry
          g++ -std=c++20 -fsanitize=undefined -fno-sanitize-recover=all -o /tmp/idb_geometry_tests_ubsan \
            src/database/basic/geometry/IdbGeometry.cpp \
            src/database/basic/geometry/IdbLayerShape.cpp \
            src/database/basic/geometry/IdbTree.cpp \
            src/database/basic/geometry/test/IdbGeometryTests.cpp \
            -Isrc/database/basic/geometry
          /tmp/geometry_data_tests_ubsan && /tmp/idb_geometry_tests_ubsan

  build-wheel:
    name: Build Wheel
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build wheel
        uses: ./.github/actions/build-wheel

      - name: Upload repaired wheel
        uses: actions/upload-artifact@v4
        with:
          name: ecc-tools-wheel
          path: dist/wheel/repaired/*.whl
          if-no-files-found: error

  test-python-api:
    name: Test Python API
    needs: build-wheel
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test prerequisites
        run: dnf install -y git make curl tar bzip2 unzip

      - name: Setup Python 3.11
        run: echo "/opt/python/cp311-cp311/bin" >> "$GITHUB_PATH"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true

      - name: Download repaired wheel
        uses: actions/download-artifact@v4
        with:
          name: ecc-tools-wheel
          path: dist/wheel/repaired

      - name: Install built wheel
        run: |
          uv venv .venv-test
          uv pip install --python .venv-test/bin/python pytest dist/wheel/repaired/*.whl
          cd test
          ../.venv-test/bin/python -c 'from ecc_tools_bin import ecc_py; print(ecc_py.__file__)'

      - name: Setup PDK
        run: |
          git clone --depth 1 https://github.com/openecos-projects/icsprout55-pdk.git icsprout55-pdk
          cd icsprout55-pdk && make unzip

      - name: Run Python API integration tests
        working-directory: test
        env:
          ECC_TOOLS_TEST_ARTIFACT_ROOT: ${{ github.workspace }}/test-artifacts
          ECC_TOOLS_TEST_PDK_ROOT: ${{ github.workspace }}/icsprout55-pdk
          ECC_TOOLS_TEST_REPO_ROOT: ${{ github.workspace }}
          ECC_LOGGER_THROW_ON_ERROR: '1'
        run: ../.venv-test/bin/python -m pytest data operations -v --maxfail=1

      - name: Upload Python API artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ecc-tools-python-api-artifacts
          if-no-files-found: ignore
          path: test-artifacts/

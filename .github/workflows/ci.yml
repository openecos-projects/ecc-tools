name: CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - 'build.sh'
      - 'scripts/binding_census/**'
      - '.github/**'
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-wheel:
    name: Build Wheel
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build wheel
        uses: ./.github/actions/build-wheel

      - name: Upload repaired wheel
        uses: actions/upload-artifact@v4
        with:
          name: ecc-tools-wheel
          path: dist/wheel/repaired/*.whl
          if-no-files-found: error

  binding-census:
    name: Binding Census
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run census parser tests
        run: uv run --no-project --with jsonschema --with pytest python -m pytest scripts/binding_census/test_binding_census.py -q

      - name: Check census manifest
        run: uv run --no-project --with jsonschema python scripts/binding_census/binding_census.py --check

      - name: Compile and run path helper fixture
        run: |
          g++ -std=c++20 -Wall -Werror src/interface/python/test/py_path_utils_test.cc -o /tmp/py_path_utils_test
          /tmp/py_path_utils_test

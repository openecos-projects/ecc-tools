name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g., v0.1.0-alpha.11)'
        required: true
        default: 'v0.1.0-alpha.11'
      publish_target:
        description: 'Artifacts to publish'
        required: true
        default: 'cnb-only'
        type: choice
        options:
          - cnb-only
          - all

permissions:
  contents: write

jobs:
  build:
    name: Build Wheel
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Build wheel
        uses: ./.github/actions/build-wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecc-tools-wheel
          path: |
            dist/wheel/repaired/*.whl
          if-no-files-found: error

  release:
    name: Create Release
    if: github.event_name != 'workflow_dispatch' || inputs.publish_target == 'all'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: ecc-tools-wheel
          path: dist/wheel/repaired

      - name: Determine tag version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FULL_TAG="${{ github.event.inputs.tag_name }}"
            TAG_VERSION="${FULL_TAG#v}"
          else
            FULL_TAG="${GITHUB_REF_NAME}"
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "full_tag=$FULL_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --latest --output release-changelog.md
          github_token: ${{ github.token }}
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate release notes
        id: notes
        run: |
          {
            cat release-changelog.md
            echo ""
            echo "## Checksums"
            echo ""
            echo '```'
            (
              cd dist/wheel/repaired
              sha256sum *.whl
            )
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.full_tag }}" \
            --title "ecc-tools ${{ steps.version.outputs.full_tag }}" \
            --notes-file release-notes.md \
            dist/wheel/repaired/*.whl

  cnb-publish:
    name: Publish Wheel to CNB
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: ecc-tools-wheel
          path: dist/wheel/repaired

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Publish wheel to CNB
        run: uv publish --no-attestations dist/wheel/repaired/*.whl
        env:
          UV_PUBLISH_URL: https://pypi.cnb.cool/ecoslab/ecos-eda/-/packages/simple
          UV_PUBLISH_USERNAME: cnb
          UV_PUBLISH_PASSWORD: ${{ secrets.CNB_PYPI_TOKEN }}
